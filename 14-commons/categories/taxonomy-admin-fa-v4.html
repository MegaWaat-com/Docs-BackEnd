<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت تاکسونومی مگاوات</title><style>
:root{--p:#1e40af;--bg:#f8fafc;--bd:#e2e8f0;--mut:#64748b;--danger:#dc2626}*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}body{margin:0;background:var(--bg);color:#0f172a}header{background:#1e3a8a;color:white;padding:14px 22px;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions,.tabs,.row,.pills{display:flex;gap:8px;flex-wrap:wrap}.tabs{background:white;border-bottom:1px solid var(--bd);overflow:auto;padding:0 12px}.tabs button{padding:12px;border:0;border-bottom:3px solid transparent;background:white;white-space:nowrap;cursor:pointer}.tabs button.active{color:var(--p);border-color:var(--p);background:#eff6ff}main{padding:16px;max-width:1500px;margin:auto}.view{display:none}.view.active{display:block}.grid2{display:grid;grid-template-columns:350px 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:white;border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0001}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:12px}.btn,select,input,textarea{border:1px solid var(--bd);border-radius:6px;padding:8px;background:white}.btn{cursor:pointer;font-weight:bold}.primary{background:var(--p);color:white}.danger{color:var(--danger)}.tree{max-height:560px;overflow:auto;background:#f8fafc;padding:8px}.node{padding:7px;border:1px solid #eef2f7;background:white;border-radius:5px;margin:3px 0;cursor:pointer}.node.sel{background:#eff6ff;border-color:#93c5fd}.children{padding-right:18px}.pill{display:inline-flex;gap:5px;padding:5px 8px;background:#f1f5f9;border:1px solid var(--bd);border-radius:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--bd);text-align:right}.table th{background:#f8fafc;color:var(--mut)}.toast{position:fixed;bottom:20px;left:20px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:6px;display:none}.toast.show{display:block}@media(max-width:800px){.grid2{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><header><strong>⚡ پنل مدیریت تاکسونومی و هاب تخصصی مگاوات</strong><div class="actions"><button class="btn" id="btnExportJson">خروجی JSON</button><button class="btn" id="btnResetData">ریست داده نمونه</button></div></header><nav class="tabs" id="navTabs"></nav><main>
<section class="view active" id="tab-tree"><div class="grid2"><div class="card"><div class="head"><b>درخت تاکسونومی</b><button class="btn primary" id="btnAddRoot">+ فیلد</button></div><input id="treeSearch" placeholder="جستجو"><div class="tree" id="treeContainer"></div></div><div class="card"><div class="head"><b id="nodeDetailTitle">جزئیات گره</b><span id="nodeDetailType" class="pill">سطح</span></div><label>عنوان فارسی<input id="editNodeName"></label><br><label>Slug<input id="editNodeSlug"></label><br><label>توضیحات<textarea id="editNodeDesc" rows="3"></textarea></label><div class="row"><button class="btn primary" id="btnSaveNode">ذخیره</button><button class="btn" id="btnAddChildNode">+ زیرشاخه</button><button class="btn danger" id="btnDeleteNode">حذف</button></div></div></div></section>
<section class="view" id="tab-hub360"><div class="card"><div class="head"><b>هاب جامع ۳۶۰ درجه</b><select id="hubSpecialtySelect"></select><button class="btn primary" id="btnSaveHubMappings">ذخیره نگاشت</button></div><div class="grid3" id="hubBoxes"></div></div></section>
<section class="view" id="tab-brands"><div class="card"><div class="head"><b>استخر برندها</b></div><div class="row"><input id="brandSearchInput" placeholder="جستجو"><select id="brandTierFilter"><option value="ALL">همه Tier</option><option>Tier 1</option><option>Tier 2</option><option>Tier 3</option></select><select id="brandVendorFilter"><option value="ALL">همه وندورها</option><option>نفت و گاز</option><option>توانیر</option><option>پتروشیمی</option><option>مپنا</option></select></div><table class="table"><thead><tr><th>برند</th><th>Tier</th><th>کشور</th><th>وندورها</th><th></th></tr></thead><tbody id="brandTableBody"></tbody></table></div></section>
<section class="view" id="tab-software"><div class="card"><div class="head"><b>استخر نرم‌افزارها</b><select id="softwareCategoryFilter"><option value="ALL">همه دسته‌ها</option><option>تحلیلی</option><option>CAD</option><option>کانفیگ</option><option>اسکادا</option><option>محاسباتی</option></select></div><table class="table"><thead><tr><th>نام</th><th>دسته</th><th>توسعه‌دهنده</th><th>ارزیابی</th><th></th></tr></thead><tbody id="softwareTableBody"></tbody></table></div></section>
<section class="view" id="tab-skills"><div class="card"><div class="head"><b>استخر مستقل مهارت‌ها</b><div class="row"><input id="quickSkillInput" placeholder="مهارت جدید"><button class="btn primary" id="btnQuickSkillAdd">افزودن سریع</button></div></div><table class="table"><thead><tr><th>مهارت</th><th>Badge / ارزیابی</th><th>تخصص‌های متصل</th><th></th></tr></thead><tbody id="skillTableBody"></tbody></table></div></section>
<section class="view" id="tab-plant-sys"><div class="card"><h3>پلنت ➜ سیستم ➜ تجهیزات</h3><div class="grid3"><div><label>پلنت<select id="plantSelect"></select></label><input id="plantIndustry" readonly></div><div><label>سیستم<select id="systemSelect"></select></label></div><div id="cascadingEquipList"></div></div></div></section></main><div id="appToast" class="toast"></div>
<script>
const names=['درخت تاکسونومی','هاب جامع ۳۶۰°','استخر برندها','استخر نرم‌افزارها','استخر مهارت‌ها','پلنت و تجهیزات'],ids=['tab-tree','tab-hub360','tab-brands','tab-software','tab-skills','tab-plant-sys'];
const mk=(a,f)=>a.map(f);const id=()=>Math.random().toString(36).slice(2);const tree=[{id:'field-elec',name:'مهندسی برق و قدرت',slug:'electrical',type:'field',desc:'حوزه برق',children:[{id:'spec-sub',name:'طراحی پست‌های فشار قوی',slug:'substations',type:'specialty',desc:'پست و ترانس',children:mk(['ترانسفورماتورهای قدرت','پست GIS'],(x,i)=>({id:'cat'+i,name:x,type:'category',children:[]}))}]},{id:'field-auto',name:'اتوماسیون صنعتی',slug:'automation',type:'field',desc:'کنترل صنعتی',children:[{id:'spec-plc',name:'PLC و DCS',slug:'plc-dcs',type:'specialty',desc:'کنترل فرآیند',children:[]}]}];
const brands=mk([['Siemens','آلمان','Tier 1','نفت و گاز,توانیر,مپنا'],['ABB','سوئیس/سوئد','Tier 1','نفت و گاز,توانیر'],['Delta','تایوان','Tier 2',''],['پارس تابلو','ایران','Tier 2','توانیر,پتروشیمی']],(x,i)=>({id:'b'+i,name:x[0],origin:x[1],tier:x[2],vendors:x[3]?x[3].split(','):[]}));
const software=mk([['ETAP','تحلیلی','ETAP'],['TIA Portal','کانفیگ','Siemens'],['WinCC','اسکادا','Siemens'],['AutoCAD Electrical','CAD','Autodesk'],['MATLAB','محاسباتی','MathWorks']],(x,i)=>({id:'sw'+i,name:x[0],category:x[1],vendor:x[2],hasBadge:i%2===0}));
const skills=mk(['هماهنگی حفاظتی','طراحی لاجیک کنترل','سایزینگ کابل و ترانس','طراحی SCADA'],(x,i)=>({id:'sk'+i,name:x,badge:i%2?'آزمون تخصصی':'نشان مگاوات'}));
const plants=mk([['پالایشگاه نفت و گاز','نفت، گاز و پتروشیمی'],['نیروگاه سیکل ترکیبی','تولید برق و انرژی']],(x,i)=>({id:'p'+i,name:x[0],industry:x[1],systems:mk(['سیستم فرآیندی','سیستم برق'],(y,j)=>({id:'s'+i+j,name:y,equipment:['ترانسمیتر فشار','بریکر گازی','سنسور دما'].slice(j,j+2)}))}));
const defaultState={tree,brands,software,skills,plants,maps:{}};let S=JSON.parse(localStorage.megawaat_taxonomy_state||'null')||structuredClone(defaultState);let selected=S.tree[0];
function save(){localStorage.megawaat_taxonomy_state=JSON.stringify(S)}function toast(x){let e=document.getElementById('appToast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function all(n=S.tree,a=[]){n.forEach(x=>{if(x.type==='specialty')a.push(x);if(x.children)all(x.children,a)});return a}function find(n,k){for(const x of n){if(x.id===k)return x;const y=x.children&&find(x.children,k);if(y)return y}return null}
function renderTree(){let q=document.getElementById('treeSearch').value.toLowerCase(),box=document.getElementById('treeContainer');box.innerHTML='';function draw(n,par){n.forEach(x=>{if(q&&!x.name.toLowerCase().includes(q)&&!(x.children||[]).some(c=>c.name.toLowerCase().includes(q)))return;let e=document.createElement('div');e.className='node '+(selected.id===x.id?'sel':'');e.textContent=(x.children?.length?'▾ ':'• ')+(x.type==='field'?'فیلد':x.type==='specialty'?'تخصص':'دسته')+' | '+x.name;e.onclick=()=>{selected=x;renderTree();loadNode()};e.oncontextmenu=z=>{z.preventDefault();let a=prompt('عملیات: نام جدید را وارد کنید (خالی=لغو)',x.name);if(a){x.name=a;save();renderTree();loadNode()}};par.appendChild(e);if(x.children?.length){let c=document.createElement('div');c.className='children';draw(x.children,c);par.appendChild(c)}})}draw(S.tree,box)(S.tree,box)}
function loadNode(){editNodeName.value=selected.name;editNodeSlug.value=selected.slug||'';editNodeDesc.value=selected.desc||'';nodeDetailTitle.textContent=selected.name;nodeDetailType.textContent=selected.type}
function renderHub(){let sel=hubSpecialtySelect;sel.innerHTML='';all().forEach(x=>sel.add(new Option(x.name,x.id)));sel.onchange=()=>hub(sel.value);if(sel.value)hub(sel.value)}
function hub(k){let m=S.maps[k]||={skills:[],software:[],brands:[],equipment:[]};hubBoxes.innerHTML='';[['مهارت‌ها','skills',S.skills],['نرم‌افزارها','software',S.software],['برندها','brands',S.brands]].forEach(([title,key,list])=>{let c=document.createElement('div');c.className='card';c.innerHTML='<b>'+title+'</b><div class="pills"></div>';list.forEach(x=>{let p=document.createElement('span');p.className='pill';p.textContent=x.name;p.onclick=()=>{m[key]=m[key].includes(x.id)?m[key].filter(y=>y!==x.id):m[key].concat(x.id);save();hub(k)};if(m[key].includes(x.id))c.querySelector('.pills').append(p)});hubBoxes.append(c)});let c=document.createElement('div');c.className='card';c.innerHTML='<b>تجهیزات و خانواده محصولات</b><div class="pills"></div>';m.equipment.forEach(x=>{let p=document.createElement('span');p.className='pill';p.textContent=x;p.onclick=()=>{m.equipment=m.equipment.filter(y=>y!==x);save();hub(k)};c.querySelector('.pills').append(p)});hubBoxes.append(c)}
function table(kind){let body=document.getElementById(kind+'TableBody');if(!body)return;body.innerHTML='';let list=S[kind],filter=kind==='software'?softwareCategoryFilter.value:'',q=kind==='brands'?brandSearchInput.value.toLowerCase():'';list.filter(x=>!filter||filter==='ALL'||x.category===filter).filter(x=>!q||x.name.toLowerCase().includes(q)||x.origin.toLowerCase().includes(q)).forEach((x,i)=>{let tr=document.createElement('tr');tr.innerHTML=kind==='brands'?`<td>${x.name}</td><td>${x.tier}</td><td>${x.origin}</td><td>${x.vendors.join('، ')||'ندارد'}</td><td><button class="danger" onclick="del('${kind}',${i})">حذف</button></td>`:`<td>${x.name}</td><td>${x.category||x.badge}</td><td>${x.vendor||count(x.id)}</td><td><button class="danger" onclick="del('${kind}',${i})">حذف</button></td>`;body.append(tr)})}function count(k){return Object.values(S.maps).filter(x=>(x.skills||[]).includes(k)).length+' تخصص'}function del(k,i){S[k].splice(i,1);save();table(k);toast('حذف شد')}window.del=del;
function plant(){plantSelect.innerHTML='';S.plants.forEach(x=>plantSelect.add(new Option(x.name,x.id)));let p=S.plants.find(x=>x.id===plantSelect.value)||S.plants[0];plantSelect.value=p.id;plantIndustry.value=p.industry;systemSelect.innerHTML='';p.systems.forEach(x=>systemSelect.add(new Option(x.name,x.id)));let s=p.systems[0];cascadingEquipList.innerHTML=s.equipment.map(x=>'<div class="pill">⚙ '+x+'</div>').join('');systemSelect.onchange=()=>{s=p.systems.find(x=>x.id===systemSelect.value);cascadingEquipList.innerHTML=s.equipment.map(x=>'<div class="pill">⚙ '+x+'</div>').join('')};plantSelect.onchange=plant}
function init(){navTabs.innerHTML=mk(names,(n,i)=>`<button data-tab="${ids[i]}">${i+1}. ${n}</button>`).join('');navTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});navTabs.firstChild.classList.add('active');renderTree();loadNode();renderHub();table('brands');table('software');table('skills');plant()}
btnSaveNode.onclick=()=>{selected.name=editNodeName.value;selected.slug=editNodeSlug.value;selected.desc=editNodeDesc.value;save();renderTree();renderHub();toast('ذخیره شد')};treeSearch.oninput=renderTree;btnAddRoot.onclick=()=>{let n=prompt('نام فیلد');if(n){selected={id:id(),name:n,type:'field',slug:id(),children:[]};S.tree.push(selected);save();renderTree();loadNode()}};btnAddChildNode.onclick=()=>{let n=prompt('نام زیرشاخه');if(n){let x={id:id(),name:n,type:selected.type==='field'?'specialty':'category',slug:id(),children:[]};(selected.children||(selected.children=[])).push(x);selected=x;save();renderTree();loadNode();renderHub()}};btnDeleteNode.onclick=()=>{if(!confirm('حذف شود؟'))return;function rm(a){let i=a.findIndex(x=>x.id===selected.id);if(i>=0){a.splice(i,1);return true}return a.some(x=>x.children&&rm(x.children))}rm(S.tree);selected=S.tree[0];save();renderTree();loadNode();renderHub()};btnQuickSkillAdd.onclick=()=>{if(quickSkillInput.value.trim()){S.skills.push({id:id(),name:quickSkillInput.value.trim(),badge:'ثبت سریع'});quickSkillInput.value='';save();table('skills')}};btnSaveHubMappings.onclick=()=>{save();toast('نگاشت ذخیره شد')};[brandSearchInput,brandTierFilter,brandVendorFilter].forEach(x=>x.oninput=()=>table('brands'));softwareCategoryFilter.onchange=()=>table('software');btnExportJson.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='megawaat-taxonomy.json';a.click()};btnResetData.onclick=()=>{S=structuredClone(defaultState);save();location.reload()};addEventListener('DOMContentLoaded',init);
</script></body></html>
